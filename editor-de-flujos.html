<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Flujos · CASSA IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16233f;
    --navy-2:#1d3157;
    --blue:#2f5fa8;
    --blue-soft:#eaf0fa;
    --purple:#6a3f9e;
    --ink:#1b2433;
    --mut:#5b6778;
    --line:#d7dee9;
    --bg:#f4f6fa;
    --card:#ffffff;
    --edge:#8b98b8;
    --select:#e0921f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:var(--bg);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ===== TOPBAR ===== */
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:var(--card);
    flex:none;
    flex-wrap:wrap;
  }
  .back-link{
    display:flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600;
    color:var(--navy-2);
    text-decoration:none;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    flex:none;
  }
  .back-link:hover{ border-color:var(--blue); background:var(--blue-soft); }
  .back-link svg{ width:15px; height:15px; stroke:currentColor; }

  .title-inputs{ display:flex; flex-direction:column; gap:2px; margin-right:8px; }
  .title-inputs input{
    border:1px solid transparent;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:15px; color:var(--navy);
    padding:2px 4px; border-radius:5px; background:transparent;
    width:280px;
  }
  .title-inputs input.sub{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:400; font-size:11.5px; color:var(--mut);
  }
  .title-inputs input:hover, .title-inputs input:focus{ border-color:var(--line); background:var(--bg); outline:none; }

  .toolbar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tbtn{
    display:flex; align-items:center; gap:6px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px; font-weight:600;
    color:var(--navy-2);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 11px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    white-space:nowrap;
  }
  .tbtn svg{ width:15px; height:15px; stroke:currentColor; flex:none; }
  .tbtn:hover{ border-color:var(--blue); background:var(--blue-soft); }
  .tbtn.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .tbtn.danger:hover{ border-color:#c0392b; background:#fdecea; color:#c0392b; }
  .tsep{ width:1px; align-self:stretch; background:var(--line); margin:0 4px; }
  .file-input{ display:none; }

  /* ===== CANVAS ===== */
  .viewport{
    position:relative;
    flex:1;
    min-height:0;
    overflow:auto;
    background:
      linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(0deg, rgba(0,0,0,.035) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
  }
  .canvas{
    position:relative;
    width:2600px;
    height:1700px;
  }
  .canvas > svg{ position:absolute; top:0; left:0; width:100%; height:100%; overflow:visible; pointer-events:none; }

  /* ===== NODOS ===== */
  .gnode{
    position:absolute;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    box-shadow:0 1px 3px rgba(15,25,50,.06);
    padding:10px 16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    cursor:grab;
    user-select:none;
  }
  .gnode:active{ cursor:grabbing; }
  .gnode.selected{ outline:2.5px solid var(--select); outline-offset:2px; }
  .gnode .gn-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:13.5px; line-height:1.25;
  }
  .gnode .gn-sub{ font-size:10.5px; color:var(--mut); line-height:1.3; margin-top:3px; }

  .gnode.type-process{ color:var(--ink); }
  .gnode.type-entry{
    background:linear-gradient(160deg,var(--navy),#0f1930);
    border-color:transparent; color:#fff;
  }
  .gnode.type-entry .gn-sub{ color:#cfe0ff; }
  .gnode.type-final{ border-left:4px solid var(--blue); color:var(--ink); }

  .gnode.type-decision{
    background:linear-gradient(160deg,var(--purple),#4c2c74);
    clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    color:#fff; border:none;
  }
  .gnode.type-decision .gn-title{ max-width:70%; }

  .connect-armed{ outline:2.5px dashed var(--blue); outline-offset:3px; }

  /* ===== EDGES ===== */
  .edge-label{
    position:absolute;
    transform:translate(-50%,-50%);
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:3px 9px;
    font-size:11px; font-weight:600; color:var(--navy-2);
    cursor:pointer;
    pointer-events:auto;
  }
  .edge-label.selected{ outline:2.5px solid var(--select); }
  .edge-hit{ cursor:pointer; pointer-events:auto; }

  .hint-bar{
    flex:none;
    padding:6px 16px;
    font-size:11.5px; color:var(--mut);
    background:var(--card);
    border-top:1px solid var(--line);
  }
  .hint-bar b{ color:var(--ink); }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="modelo-prestacion-servicio-it.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Volver
  </a>

  <div class="title-inputs">
    <input id="titleInput" value="Nuevo flujo">
    <input class="sub" id="subInput" value="Subtítulo del diagrama">
  </div>

  <div class="tsep"></div>

  <div class="toolbar">
    <button class="tbtn" data-add="entry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      Entrada
    </button>
    <button class="tbtn" data-add="process">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      Proceso
    </button>
    <button class="tbtn" data-add="decision">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1" transform="rotate(45 12 12)"/></svg>
      Decisión
    </button>
    <button class="tbtn" data-add="final">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
      Final
    </button>

    <div class="tsep"></div>

    <button class="tbtn" id="connectBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Conectar
    </button>
    <button class="tbtn danger" id="deleteBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Eliminar
    </button>

    <div class="tsep"></div>

    <button class="tbtn" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
      Guardar (.json)
    </button>
    <button class="tbtn" id="loadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15c.1-.6.2-1.3.2-2a9.2 9.2 0 0 0-9.2-9.2c-4.4 0-8.2 3-9.1 7.1"/><path d="M3 4v5h5"/><path d="M2.8 9A9.2 9.2 0 0 0 12 21.2c3.3 0 6.2-1.8 7.7-4.5"/><path d="M17 21l-5-5"/></svg>
      Cargar
    </button>
    <input type="file" id="fileInput" class="file-input" accept="application/json">
    <button class="tbtn" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exportar HTML
    </button>
  </div>
</div>

<div class="viewport" id="viewport">
  <div class="canvas" id="canvas">
    <svg id="svgLayer"></svg>
  </div>
</div>

<div class="hint-bar">
  Arrastra un nodo para moverlo · doble clic para renombrarlo · <b>Conectar</b>: clic en el nodo origen, luego en el destino · clic en un nodo o flecha y pulsa <b>Eliminar</b> (o la tecla Supr) · el lienzo tiene scroll normal para desplazarte.
</div>

<script>
(function(){
  var canvas = document.getElementById('canvas');
  var svg = document.getElementById('svgLayer');
  var viewport = document.getElementById('viewport');

  var nodes = [];
  var edges = [];
  var nextId = 1;
  var selected = null;
  var connectMode = false;
  var connectSource = null;
  var cascade = 0;

  var DEFAULTS = {
    entry:    {w:240, h:74,  title:'Entrada'},
    process:  {w:220, h:72,  title:'Proceso'},
    decision: {w:190, h:130, title:'¿Decisión?'},
    final:    {w:220, h:72,  title:'Final'}
  };

  function uid(prefix){ return prefix + (nextId++); }

  function addNode(type){
    var d = DEFAULTS[type];
    var n = {
      id: uid('n'),
      type: type,
      x: 300 + (cascade % 8) * 40,
      y: 200 + (cascade % 8) * 40,
      w: d.w, h: d.h,
      title: d.title,
      sub: ''
    };
    cascade++;
    nodes.push(n);
    render();
    return n;
  }

  function addEdge(fromId, toId){
    if(fromId === toId) return;
    var exists = edges.some(function(e){ return e.from === fromId && e.to === toId; });
    if(exists) return;
    edges.push({ id: uid('e'), from: fromId, to: toId, label: '' });
    render();
  }

  function deleteSelected(){
    if(!selected) return;
    if(selected.kind === 'node'){
      nodes = nodes.filter(function(n){ return n.id !== selected.id; });
      edges = edges.filter(function(e){ return e.from !== selected.id && e.to !== selected.id; });
    } else if(selected.kind === 'edge'){
      edges = edges.filter(function(e){ return e.id !== selected.id; });
    }
    selected = null;
    render();
  }

  function selectItem(kind, id){
    selected = { kind: kind, id: id };
    render();
  }

  function nodeCenter(n){ return { x: n.x, y: n.y }; }
  function findNode(id){ return nodes.find(function(n){ return n.id === id; }); }

  function edgePath(a, b){
    var dx = b.x - a.x, dy = b.y - a.y;
    return 'M ' + a.x.toFixed(1) + ',' + a.y.toFixed(1) + ' L ' + b.x.toFixed(1) + ',' + b.y.toFixed(1);
  }

  function render(){
    // nodes
    canvas.querySelectorAll('.gnode').forEach(function(el){ el.remove(); });
    nodes.forEach(function(n){
      var el = document.createElement('div');
      el.className = 'gnode type-' + n.type + (selected && selected.kind==='node' && selected.id===n.id ? ' selected' : '') + (connectSource === n.id ? ' connect-armed' : '');
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
      el.style.width = n.w + 'px';
      el.style.height = n.h + 'px';
      el.style.transform = 'translate(-50%,-50%)';
      var titleHtml = '<div class="gn-title">' + escapeHtml(n.title) + '</div>';
      var subHtml = n.sub ? '<div class="gn-sub">' + escapeHtml(n.sub) + '</div>' : '';
      el.innerHTML = titleHtml + subHtml;
      el.dataset.id = n.id;
      canvas.appendChild(el);

      el.addEventListener('mousedown', function(e){ onNodeMouseDown(e, n); });
      el.addEventListener('dblclick', function(e){
        e.stopPropagation();
        var t = window.prompt('Título del nodo:', n.title);
        if(t !== null){ n.title = t; }
        var s = window.prompt('Subtítulo (opcional, vacío para ninguno):', n.sub || '');
        if(s !== null){ n.sub = s; }
        render();
      });
      el.addEventListener('click', function(e){
        e.stopPropagation();
        if(connectMode){
          if(!connectSource){
            connectSource = n.id;
            render();
          } else {
            addEdge(connectSource, n.id);
            connectSource = null;
          }
        } else {
          selectItem('node', n.id);
        }
      });
    });

    // edges
    var svgHtml = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker></defs>';
    edges.forEach(function(ed){
      var a = findNode(ed.from), b = findNode(ed.to);
      if(!a || !b) return;
      var isSel = selected && selected.kind==='edge' && selected.id===ed.id;
      var path = edgePath(nodeCenter(a), nodeCenter(b));
      svgHtml += '<path d="' + path + '" fill="none" stroke="' + (isSel ? 'var(--select)' : 'var(--edge)') + '" stroke-width="' + (isSel?3:2.2) + '" marker-end="url(#arrow)" class="edge-hit" data-edge="' + ed.id + '"/>';
      svgHtml += '<path d="' + path + '" fill="none" stroke="transparent" stroke-width="16" class="edge-hit" data-edge="' + ed.id + '"/>';
    });
    svg.innerHTML = svgHtml;
    svg.querySelectorAll('[data-edge]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        selectItem('edge', el.dataset.edge);
      });
      el.addEventListener('dblclick', function(e){
        e.stopPropagation();
        var ed = edges.find(function(x){ return x.id === el.dataset.edge; });
        var l = window.prompt('Etiqueta de la flecha (ej. Sí / No), vacío para quitarla:', ed.label || '');
        if(l !== null){ ed.label = l; render(); }
      });
    });

    // edge labels
    canvas.querySelectorAll('.edge-label').forEach(function(el){ el.remove(); });
    edges.forEach(function(ed){
      if(!ed.label) return;
      var a = findNode(ed.from), b = findNode(ed.to);
      if(!a || !b) return;
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var lab = document.createElement('div');
      lab.className = 'edge-label' + (selected && selected.kind==='edge' && selected.id===ed.id ? ' selected' : '');
      lab.style.left = mx + 'px';
      lab.style.top = my + 'px';
      lab.textContent = ed.label;
      lab.addEventListener('click', function(e){ e.stopPropagation(); selectItem('edge', ed.id); });
      canvas.appendChild(lab);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  // ---- dragging nodes ----
  var dragging = null, dragOffX = 0, dragOffY = 0, dragMoved = false;
  function onNodeMouseDown(e, n){
    if(connectMode) return;
    e.stopPropagation();
    var rect = canvas.getBoundingClientRect();
    dragging = n;
    dragMoved = false;
    dragOffX = (e.clientX - rect.left) - n.x;
    dragOffY = (e.clientY - rect.top) - n.y;
  }
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    dragMoved = true;
    var rect = canvas.getBoundingClientRect();
    dragging.x = Math.round((e.clientX - rect.left) - dragOffX);
    dragging.y = Math.round((e.clientY - rect.top) - dragOffY);
    render();
  });
  window.addEventListener('mouseup', function(){
    dragging = null;
  });

  // click empty canvas = deselect / cancel connect
  canvas.addEventListener('click', function(){
    selected = null;
    connectSource = null;
    render();
  });

  // keyboard delete
  window.addEventListener('keydown', function(e){
    if((e.key === 'Delete' || e.key === 'Backspace') && selected){
      var tag = document.activeElement.tagName;
      if(tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      deleteSelected();
    }
  });

  // ---- toolbar ----
  document.querySelectorAll('[data-add]').forEach(function(btn){
    btn.addEventListener('click', function(){ addNode(btn.dataset.add); });
  });

  var connectBtn = document.getElementById('connectBtn');
  connectBtn.addEventListener('click', function(){
    connectMode = !connectMode;
    connectSource = null;
    connectBtn.classList.toggle('active', connectMode);
    render();
  });

  document.getElementById('deleteBtn').addEventListener('click', deleteSelected);

  document.getElementById('saveBtn').addEventListener('click', function(){
    var data = {
      title: document.getElementById('titleInput').value,
      subtitle: document.getElementById('subInput').value,
      nodes: nodes, edges: edges, nextId: nextId
    };
    downloadBlob(JSON.stringify(data, null, 2), 'application/json', 'flujo.json');
  });

  document.getElementById('loadBtn').addEventListener('click', function(){
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        nodes = data.nodes || [];
        edges = data.edges || [];
        nextId = data.nextId || (nodes.length + edges.length + 1);
        document.getElementById('titleInput').value = data.title || 'Nuevo flujo';
        document.getElementById('subInput').value = data.subtitle || '';
        selected = null; connectSource = null; connectMode = false;
        connectBtn.classList.remove('active');
        render();
      }catch(err){
        alert('No se ha podido leer el archivo: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('exportBtn').addEventListener('click', exportHtml);

  function downloadBlob(content, mime, filename){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function exportHtml(){
    var title = document.getElementById('titleInput').value || 'Flujo';
    var subtitle = document.getElementById('subInput').value || '';

    var xs = nodes.map(function(n){ return n.x; });
    var ys = nodes.map(function(n){ return n.y; });
    var maxX = xs.length ? Math.max.apply(null, xs) + 200 : 1200;
    var maxY = ys.length ? Math.max.apply(null, ys) + 200 : 800;

    var nodeDivs = nodes.map(function(n){
      var cls = 'enode type-' + n.type;
      var sub = n.sub ? '<div class="gn-sub">' + escapeHtml(n.sub) + '</div>' : '';
      return '<div class="' + cls + '" style="left:' + n.x + 'px; top:' + n.y + 'px; width:' + n.w + 'px; height:' + n.h + 'px;">' +
        '<div class="gn-title">' + escapeHtml(n.title) + '</div>' + sub + '</div>';
    }).join('\n    ');

    var svgPaths = edges.map(function(ed){
      var a = findNode(ed.from), b = findNode(ed.to);
      if(!a || !b) return '';
      return '<path d="' + edgePath(nodeCenter(a), nodeCenter(b)) + '" fill="none" stroke="#8b98b8" stroke-width="2.2" marker-end="url(#arrow)"/>';
    }).join('\n      ');

    var labelDivs = edges.filter(function(ed){ return ed.label; }).map(function(ed){
      var a = findNode(ed.from), b = findNode(ed.to);
      if(!a || !b) return '';
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      return '<div class="elabel" style="left:' + mx + 'px; top:' + my + 'px;">' + escapeHtml(ed.label) + '</div>';
    }).join('\n    ');

    var html = '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + escapeHtml(title) + '</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">\n' +
      '<style>\n' +
      ':root{--navy:#16233f;--blue:#2f5fa8;--purple:#6a3f9e;--ink:#1b2433;--mut:#5b6778;--line:#d7dee9;--bg:#f4f6fa;--card:#fff;}\n' +
      '*{box-sizing:border-box;} body{margin:0;background:var(--bg);font-family:\'IBM Plex Sans\',sans-serif;color:var(--ink);padding:30px 40px;}\n' +
      'h1{font-family:\'Space Grotesk\',sans-serif;font-size:24px;color:var(--navy);margin:0 0 4px;}\n' +
      '.subtitle{font-size:13px;color:var(--mut);margin:0 0 20px;}\n' +
      '.canvas{position:relative;width:' + maxX + 'px;height:' + maxY + 'px;}\n' +
      '.canvas>svg{position:absolute;top:0;left:0;overflow:visible;}\n' +
      '.enode{position:absolute;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(15,25,50,.06);padding:10px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:translate(-50%,-50%);}\n' +
      '.enode .gn-title{font-family:\'Space Grotesk\',sans-serif;font-weight:600;font-size:13.5px;line-height:1.25;}\n' +
      '.enode .gn-sub{font-size:10.5px;color:var(--mut);margin-top:3px;}\n' +
      '.enode.type-entry{background:linear-gradient(160deg,var(--navy),#0f1930);border-color:transparent;color:#fff;}\n' +
      '.enode.type-entry .gn-sub{color:#cfe0ff;}\n' +
      '.enode.type-final{border-left:4px solid var(--blue);}\n' +
      '.enode.type-decision{background:linear-gradient(160deg,var(--purple),#4c2c74);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);color:#fff;border:none;}\n' +
      '.elabel{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:600;color:#1d3157;}\n' +
      '</style>\n</head>\n<body>\n' +
      '<h1>' + escapeHtml(title) + '</h1>\n' +
      (subtitle ? '<p class="subtitle">' + escapeHtml(subtitle) + '</p>\n' : '') +
      '<div class="canvas">\n' +
      '<svg width="' + maxX + '" height="' + maxY + '"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b98b8"/></marker></defs>\n      ' +
      svgPaths + '\n    </svg>\n    ' +
      nodeDivs + '\n    ' +
      labelDivs + '\n  </div>\n</body>\n</html>\n';

    downloadBlob(html, 'text/html', (title.toLowerCase().replace(/[^a-z0-9]+/g,'-') || 'flujo') + '.html');
  }

  // seed with a starting node so the canvas isn't empty
  addNode('entry');
  nodes[0].title = 'Inicio';
  nodes[0].x = 400; nodes[0].y = 150;
  render();
})();
</script>

</body>
</html>
